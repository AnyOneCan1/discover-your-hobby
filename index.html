<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>اكتشف هوايتك المثالية</title>
  <style>
    body {
      direction: rtl;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }
    #app {
      text-align: center;
      max-width: 400px;
    }
    input {
      width: 100%;
      padding: 0.5em;
      margin-top: 1em;
    }
    button {
      margin-top: 0.5em;
      padding: 0.5em 1em;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>اكتشف هوايتك المثالية</h1>
    <div id="question">جارٍ التحميل…</div>
    <input id="answer" placeholder="اكتب إجابتك هنا" autocomplete="off" />
    <button id="submit">إرسال</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
